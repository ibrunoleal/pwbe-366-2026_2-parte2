{% extends 'base.html' %}

{% block title %} Relação de Alunos {% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/table.css') }}">
{% endblock %}

{% block content %}
<div class="grid-container">
    <div class="grid-row texto-centralizado">
        <div class="col-12">
            <h2>Alunos cadastrados</h2>
        </div>
    </div>
    <div class="grid-row">
        <div class="col-12">
            <div>
                <table>
                    <tr>
                        <th>matricula</th>
                        <th>nome</th>
                        <th></th>
                    </tr>
                    {% for aluno in context.alunos %}
                    <tr>
                        <td>{{ aluno.matricula }}</td>
                        <td>{{ aluno.nome }}</td>
                        <td class="celula-acao">
                            <!-- utilizando a chamada de rota via endpoin ao invés de usar a rota direta -->
                            <form class="form-detalhar" action="{{ url_for('aluno_buscar') }}" method="POST">
                                <input type="hidden" name="matricula" value="{{ aluno.matricula }}">
                                <button class="botao-detalhar" type="submit">Detalhar</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock%}
