{% extends 'base.html' %}

{% block title %} Novo Aluno {% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/form.css') }}">
{% endblock %}

{% block content %}
    <div class="grid-container">
        <div class="grid-row texto-centralizado">
            <div class="col-12">
                <h2>Cadastro de novo aluno</h2>
            </div>
        </div>
        <div class="grid-row">
                
            <div class="col-3"></div>
            <div class="col-6">
                <form action="/aluno/buscar" method="POST">
                    <div>
                        <label for="">Matricula:</label>
                        <input type="text" name="matricula" id="">
                    </div>
                    <div>
                        <input type="submit" value="Pesquisar">
                    </div>
                </form>
            </div>
            <div class="col-3"></div>
        </div>

    </div>
{% endblock %}
